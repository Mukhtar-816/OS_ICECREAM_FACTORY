<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OS Ice Cream Factory</title>
  <desc id="desc">A stylized ice cream factory production pipeline with mixer, freezer, and packaging stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233d"/>
      <stop offset="1" stop-color="#3b2857"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcc80"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#090d1a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <path d="M0 285c180-60 280 42 456-12 190-58 293-55 434-3 107 39 194 31 310-12V360H0Z" fill="#10182d" opacity=".75"/>
  <g transform="translate(65 65)" filter="url(#shadow)">
    <rect width="445" height="230" rx="22" fill="#f4f6fb"/>
    <path d="M38 190h369M72 190V78h84v112M186 190V78h84v112M300 190V78h84v112" fill="none" stroke="#273b59" stroke-width="8"/>
    <path d="M72 78V48h84v30M186 78V48h84v30M300 78V48h84v30" fill="none" stroke="#273b59" stroke-width="8"/>
    <circle cx="114" cy="133" r="24" fill="#6bd5c3"/>
    <circle cx="228" cy="133" r="24" fill="#ffcc80"/>
    <circle cx="342" cy="133" r="24" fill="#ff8fab"/>
    <path d="M138 133h66m48 0h66" stroke="#334b6d" stroke-width="6" stroke-dasharray="8 8"/>
    <path d="M56 214h328" stroke="url(#cream)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(575 78)">
    <text x="0" y="25" fill="#9be9dd" font-family="monospace" font-size="18" letter-spacing="4">OPERATING SYSTEMS LAB</text>
    <text x="0" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="700">ICE CREAM</text>
    <text x="0" y="140" fill="#ffcc80" font-family="Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="2">FACTORY</text>
    <path d="M2 169h470" stroke="#ff8fab" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="208" fill="#dce4f4" font-family="monospace" font-size="16">threads · semaphores · mutexes · throughput</text>
    <text x="0" y="241" fill="#9be9dd" font-family="monospace" font-size="14">MIX  →  FREEZE  →  PACKAGE</text>
  </g>
</svg>
